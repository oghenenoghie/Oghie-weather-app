name: One-time dependency lock refresh

on:
  push:
    branches:
      - feat/weather-report-promax-redesign

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: rm -f package-lock.json && npm install

      - name: Check dependency advisories
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WEATHER_API_KEY: ci-placeholder-not-a-real-key

      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/one-time-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-time-lock-refresh.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): commit patched dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
